<html>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/css/lightbox.min.css" integrity="sha512-xtV3HfYNbQXS/1R1jP53KbFcU9WXiSA1RFKzl5hRlJgdOJm4OxHCWYpskm6lN0xp0XtKGpAfVShpbvlFH3MDAA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .tumblrEmbed {
            display: flex;
            flex-direction: column;
            flex-wrap: true;
            gap: 8px;
            justify-self: center; /* for testing */
        }
        .tumblrPost {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px 8px 8px 8px;
            border-radius: 6px;
            width: 400px; /* for testing */
        }
        .tumblrPostHeader {
            width: 100%;
            height: 40px;
            vertical-align: middle;
            display: inline-block;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        .tumblrPostLinkout {
            height: 100%;
            float: right;
            top: 0;
        }
        .tumblrAvatar {
            margin: 4px;
            height: 30px;
            border-radius: 3px;
            float: left;
        }
        .tumblrPostBody * {
            margin: 0;
            max-width: 100%;
        }
        .tumblrPostBody p, .tumblrPostBody span, .tumblrPostBody audio, .tumblrPostBody figure {
            padding-top: 4px;
            padding-bottom: 4px;
        }
        .tumblrPostBody * { /* For audio & video embeds */
            width: 100%;
            overflow-wrap: break-word;
        }
        .tumblrQuote {
            font-family: 'Times New Roman', Times, serif;
        }
        .tumblrPostFooter {
            height: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .tumblrInteractionButtons * {
            display: inline-block !important;
            padding-left: 4px;
            padding-right: 4px;
        }
        .tumblrInteractionButtons svg {
            fill: white;
        }
        .tumblrInteractionButtons, a#like svg {
            fill: white;
        }
    </style>
    <body>
        <div class="tumblrEmbed">
        </div>
    </div>
    </body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon/build/global/luxon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/js/lightbox.min.js" integrity="sha512-KbRFbjA5bwNan6DvPl1ODUolvTTZ/vckssnFhka5cG80JVa5zSlRPCr055xSgU/q6oMIGhZWLhcbgIC0fyw3RQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>


    <script>
        // Lightbox settings.
        lightbox.option({
            'fadeDuration': 200,
            'resizeDuration': 200
        });

    </script>
    <script defer id="tumblrJs" src="https://axdaxis.tumblr.com/api/read/json?callback=tumblrWidgetLoad&start=0&num=50"></script>
    <script defer src="https://axdaxis.tumblr.com/api/read/json?start=0&num=50"></script>
</html>
