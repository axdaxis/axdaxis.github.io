<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }

    @keyframes scrollAnimation {
        from {
            transform: translateX(0%);
        }
        to {
            transform: translateX(-100%);
        }
    }

    .background {
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: flex;
    }

    .scroll {
        image-rendering: pixelated;
        animation: 30s linear infinite scrollAnimation;
        margin: 0;
        padding: 0;
    }
</style>


<div class="background">
    <img class="scroll" src="images/gigaqueencityscape.png" />
    <img class="scroll" src="images/gigaqueencityscape.png" />
</div>

</html>
