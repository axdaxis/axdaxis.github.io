<html>

    /* Tumblr Embed code */
    .tumblrEmbed {
        font-family: 'Source Sans Pro', sans-serif;
        display: flex;
        max-width: 100%;
        height: 500px;
        max-height: 900px;
        overflow: scroll;
        scrollbar-width: none;
        text-align: left;
        padding: 8px 8px 8px 8px; 
        flex-direction: column;
        gap: 4px;
    }
    .tumblrEmbed li {
        list-style-type: none;
        list-style: none;
    }
    .tumblrEmbed b img {
        display: block;
    }
    .tumblrEmbed img {
        width: 100%;
        max-width: 100%;
    }
    .tmblr-full {
        margin: 0;
        padding: 0;
    }
    .tumblr_posts {
        padding: 0 0 8px 0 !important;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .tumblr_post {
        background-color: rgba(0, 0, 0, 0.5);
        padding: 8px 8px 8px 8px;
        border-radius: 6px;
    }
    .tumblr_body p {
        margin: 0;
    }
    .tumblr_body blockquote, .tumblr_body figure, .tumblr_body figure iframe, .tumblr_post * .spotify_audio_player, .tumblr_body .tumblr-embed iframe {
        margin: 0;
        width: auto;
        height: auto;
    }
    .tumblr_body figure video {
        width: 100%;
        height: auto;
    }
    #tumblrEmbedBanner {
        background-color: #001935;
        margin: -8px -8px 0 -8px;
        padding: 4px 4px 4px 4px;
    }
    #tumblrEmbedBanner a {
        text-decoration: none;
        color: white;
        font-weight: bold;
        font-size: 16px;
    }
</style>
