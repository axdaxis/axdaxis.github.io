    <script>
        var wordList;
        var currentWord = "";
        var guesses = 0;
        var wordCorrect = false;
        var wordArray = [];

        const guessButton = document.querySelector("#guessButton");
        const wordInput = document.querySelector("#wordInput");
        const guessBox = document.querySelector("#guessbox");

        function guess() {
            //alert(currentWord)
            if (wordList && currentWord && wordInput.value.length == 5) {
                var correctLetters = 0;
                let paragraphHolder = document.createElement("p");
                guessBox.insertAdjacentElement("beforeend", paragraphHolder);
                let guessedWord = wordInput.value.toUpperCase();

                for (i = 0; i < 5; i++) {
                    let gLetter = guessedWord.slice(i, i + 1);
                    let wLetter = currentWord.slice(i, i + 1);
                    if (gLetter == wLetter) {
                        let correctMarking = document.createElement("span");
                        correctMarking.classList.add("correct");
                        correctMarking.innerText = gLetter;
                        paragraphHolder.insertAdjacentElement("beforeend", correctMarking)
                        correctLetters++;
                    } else if (gLetter != wLetter && currentWord.includes(gLetter)) {
                        let somewhatMarking = document.createElement("span");
                        somewhatMarking.classList.add("presentDiff");
                        somewhatMarking.innerText = gLetter;
                        paragraphHolder.insertAdjacentElement("beforeend", somewhatMarking)
                    } else if (gLetter != wLetter && !currentWord.includes(gLetter)) {
                        let wrongMarking = document.createElement("span");
                        wrongMarking.classList.add("notPresent");
                        wrongMarking.innerText = gLetter;
                        paragraphHolder.insertAdjacentElement("beforeend", wrongMarking)
                    }
                }
                guess++;
                wordArray.push(currentWord);
                if (correctLetters == 5) {
                    // correct before 6
                    
                } else if (guesses >= 6 && correctLetters == 5) {
                    // correct at 6
                } else if (guesses >= 6 && correctLetters < 5) {
                    // incorrect after 6
                }

                currentWord = wordList[Math.floor(Math.random() * wordList.length) + 1];
            }
        }
        guessButton.addEventListener("click", guess)

        fetch('./CSW21.json')
            .then(response => {
                return response.json();
            })
            .then(data => {
                wordList = data;
                currentWord = wordList[Math.floor(Math.random() * wordList.length) + 1];
                guessButton.removeAttribute("disabled");
            })
            .catch(error => console.error('Error fetching JSON:', error));
        
    </script>
